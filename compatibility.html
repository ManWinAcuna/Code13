  <script src="nav-scroll.js"></script>
  <script src="bottombar.js?v=15"></script>

  <!-- Code13's generalized entry flow (locked spec 2026-08-10): one
       question up front - person, object, or place - instead of
       numerology-app's today/date/imprint mode split. Heading dropped
       2026-08-27 (user: "no need to show the what are you comparing with
       part anymore") - the 3 cards below already explain themselves. -->
  <div class="compat-mode-select" id="modeSelect">
    <button class="mode-card" data-mode="person">
      <div class="mode-icon">🧑</div>
      <div class="mode-title">A Person</div>
      <div class="mode-desc">A partner, friend, family member, or anyone with a birthday.</div>
    </button>
    <button class="mode-card" data-mode="object">
      <div class="mode-icon">🎬</div>
      <div class="mode-title">An Object</div>
      <div class="mode-desc">A company, movie, brand, album, product — anything with a start date.</div>
    </button>
    <button class="mode-card" data-mode="place">
      <div class="mode-icon">🌍</div>
      <div class="mode-title">A Place</div>
      <div class="mode-desc">A city, state, or country and its founding energy.</div>
    </button>
  </div>

  <!-- Place mode's own follow-up question (2026-08-26, user: "once you
       click place another menu shows up again and prompts us or other") -
       same visual language as the picker above it, not a couple of pills
       tucked into the form. -->
  <div class="compat-title-row" id="placeCountryTitleRow" style="display:none">
    <a href="#" class="back-link" id="backToModesFromPlace">&larr; Change comparison</a>
  </div>
  <div class="compat-mode-select" id="placeCountrySelect" style="display:none">
    <button class="mode-card" data-country="us">
      <div class="mode-icon">🇺🇸</div>
      <div class="mode-title">United States <span class="mode-badge-lock">🔒 Code13+</span></div>
      <div class="mode-desc">Browse every state, and drill into its major cities.</div>
    </button>
    <button class="mode-card" data-country="other">
      <div class="mode-icon">🌍</div>
      <div class="mode-title">Other Country</div>
      <div class="mode-desc">Search any city, state, or country by name.</div>
    </button>
  </div>

  <div class="compat-form" id="compatForm">
    <a href="#" class="back-link" id="backToModes">&larr; Change mode</a>

    <div class="person-inputs" id="personInputs"></div>

    <button class="btn btn-large" id="calculateBtn">Calculate Compatibility</button>
  </div>

  <!-- Place mode's "United States" browser (reworked 2026-08-27 from a
       popup into a real full screen, per the user: "the whole thing
       shouldn't be a popup it should just take you into its own screen" -
       same display-swap pattern as modeSelect/placeCountrySelect above, not
       modal-overlay/.active. Every tile carries its own live score ring
       (EMAX's own tap-free "wheel"), and tapping a tile calculates and
       opens the results popup immediately - no separate Calculate step. -->
  <div class="compat-title-row" id="usPlacesTitleRow" style="display:none">
    <a href="#" class="back-link" id="usPlacesBack">&larr; Back</a>
  </div>
  <div class="us-places-screen" id="usPlacesScreen" style="display:none">
    <div class="us-places-you-row" id="usPlacesYouRow"></div>
    <h1 class="page-title" id="usPlacesHeading">A U.S. State</h1>
    <div class="emax-tile-grid" id="usPlacesGrid"></div>
  </div>

</div>

<!-- Deliberately OUTSIDE .page - see category.html for why (scroll-viewport.js
     wraps only body > .page into the app's real scrolling container; a
     position:fixed popup left nested inside it can visually lag behind or
     half-follow the background's own scroll on iOS Safari). -->
<div class="modal-overlay" id="compatModalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="compatModalClose" title="Close">&times;</button>
    <div id="compatResults"></div>
  </div>
</div>
